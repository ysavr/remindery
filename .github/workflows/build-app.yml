name: Build App

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should-build-android: ${{ steps.check-branch.outputs.should-build-android }}
      should-build-ios: ${{ steps.check-branch.outputs.should-build-ios }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Add FVM to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Flutter version from FVM
        run: fvm install

      - name: Use FVM Flutter
        run: fvm use --force

      - name: Get Flutter dependencies
        run: fvm flutter pub get

      - name: Verify Flutter installation
        run: fvm flutter --version

      - name: Build runner
        run: fvm flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: fvm flutter analyze
        continue-on-error: true

      # ✅ Security scan with Trivy (dependencies vulnerabilities)
      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          path: .

      # ✅ License compliance check (avoid forbidden licenses)
      - name: License Compliance Check
        run: fvm flutter run license_checker

      # ✅ Unit tests with coverage
      - name: Run Tests with Coverage
        run: fvm flutter test --coverage

      # ✅ MobSFScan
      - name: MobSFScan
        uses: MobSF/mobsfscan@main
        with:
          args: ". --json"

      - name: Check branch for release builds
        id: check-branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should-build-android=true" >> $GITHUB_OUTPUT
            echo "should-build-ios=true" >> $GITHUB_OUTPUT
          else
            echo "should-build-android=false" >> $GITHUB_OUTPUT
            echo "should-build-ios=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Flutter setup
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .fvm
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-${{ hashFiles('**/.fvm/fvm_config.json') }}

#      - name: Run tests
#        run: fvm flutter test
#        continue-on-error: true

  build-android:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Restore Flutter cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .fvm
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}-${{ hashFiles('**/.fvm/fvm_config.json') }}

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Add FVM to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Flutter version from FVM
        run: fvm install

      - name: Use FVM Flutter
        run: fvm use --force

      - name: Get Flutter dependencies
        run: fvm flutter pub get

      - name: Build runner
        run: fvm flutter pub run build_runner build --delete-conflicting-outputs

      # Build Debug APK (always runs)
      - name: Build Debug APK (Development)
        run: fvm flutter build apk --debug --flavor development -t lib/main_development.dart

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-development
          path: build/app/outputs/flutter-apk/*development-debug.apk

      # Build Release APKs (only on develop/main branches)
      - name: Create keystore file for release builds
        if: needs.setup.outputs.should-build-android == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/remindery.jks

      - name: Build Release APK (Development)
        if: needs.setup.outputs.should-build-android == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: fvm flutter build apk --release --flavor development -t lib/main_development.dart

      - name: Build Release APK (Staging)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: fvm flutter build apk --release --flavor staging -t lib/main_staging.dart

      - name: Build Release APK (Production)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: fvm flutter build apk --release --flavor production -t lib/main_production.dart

      - name: Upload Release APKs
        if: needs.setup.outputs.should-build-android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*release.apk

